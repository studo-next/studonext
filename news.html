<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News & Academic Alerts | studonext</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .news-wrapper {
            max-width: 900px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .news-header-banner {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .news-header-banner h1 {
            font-size: 2.2rem;
            color: var(--secondary-color);
            margin-bottom: 0.5rem;
        }

        .news-header-banner p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .news-feed-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .news-card {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            overflow: hidden;
            display: flex;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
        }

        .news-thumb {
            width: 220px;
            min-height: 160px;
            object-fit: cover;
            background: #f1f5f9;
            flex-shrink: 0;
        }

        .news-content {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex-grow: 1;
        }

        .news-date {
            font-size: 0.8rem;
            color: var(--primary-light);
            font-weight: 600;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .news-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-bottom: 0.6rem;
            line-height: 1.3;
        }

        .news-desc {
            font-size: 0.92rem;
            color: var(--text-main);
            line-height: 1.6;
            white-space: pre-line;
        }

        @media (max-width: 640px) {
            .news-card {
                flex-direction: column;
            }
            .news-thumb {
                width: 100%;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- Unified Header Navigation Bar -->
    <header class="header">
        <div class="container navbar">
            <a href="index.html" class="logo">studo<span>next</span></a>
            
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <nav class="nav-menu" id="navMenu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="predictor.html" class="nav-link">College Predictor</a>
                <a href="marketplace.html" class="nav-link">Book Marketplace</a>
                <a href="courses.html" class="nav-link">Courses</a>
                <a href="suggestions.html" class="nav-link">Exam Suggestions</a>
                <a href="resume-builder.html" class="nav-link">Resume Builder</a>
                <a href="news.html" class="nav-link active">News</a>
                <a href="admin.html" class="nav-admin-link">Admin Login</a>
                <button class="btn btn-sm btn-primary nav-login-btn" onclick="openLoginModal()">Login / Sign Up</button>
            </nav>
        </div>
    </header>

    <main class="news-wrapper">
        <div class="news-header-banner">
            <h1><i class="fas fa-newspaper" style="color: var(--primary-light);"></i> Live News & Official Bulletins</h1>
            <p>Stay updated with instant educational alerts, exam routines, and scholarship notifications.</p>
        </div>

        <div id="news-container" class="news-feed-list">
            <p style="text-align: center; color: var(--text-muted); padding: 2rem;">
                <i class="fas fa-spinner fa-spin"></i> Fetching latest news updates...
            </p>
        </div>
    </main>

    <!-- Firebase Real-Time Synchronization Engine -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ আপনার ফায়ারবেস কনফিগারেশনের তথ্য এখানে বসাবেন
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // রিয়েল-টাইম লিসেনার (onSnapshot): এডমিন প্যানেলে খবর যুক্ত বা ডিলিট হওয়ার সাথে সাথে আপডেট হবে
        function listenToLiveNews() {
            const container = document.getElementById('news-container');
            const q = query(collection(db, "dailyNews"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if(snapshot.empty) {
                    container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 2rem;">No news published yet.</p>`;
                    return;
                }

                container.innerHTML = "";
                snapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    let card = document.createElement('div');
                    card.className = 'news-card';

                    let imgTag = data.image 
                        ? `<img src="${data.image}" class="news-thumb" alt="News Image">`
                        : `<div class="news-thumb" style="display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:2rem;"><i class="fas fa-newspaper"></i></div>`;

                    card.innerHTML = `
                        ${imgTag}
                        <div class="news-content">
                            <div class="news-date"><i class="far fa-calendar-alt"></i> ${data.date || 'Today'}</div>
                            <h2 class="news-title">${data.title}</h2>
                            <p class="news-desc">${data.description}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }, (error) => {
                console.error("Error fetching live news:", error);
                container.innerHTML = `<p style="text-align: center; color: #ef4444; padding: 2rem;">Failed to load live news. Please check Firebase credentials.</p>`;
            });
        }

        listenToLiveNews();
    </script>

    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        if (menuToggle && navMenu) {
            menuToggle.addEventListener('click', () => { navMenu.classList.toggle('active'); });
        }
    </script>
</body>
</html>
